<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPv4 Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e8a'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='42' font-weight='700' text-anchor='middle' fill='white'%3E4%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #e9eef3;
    --surface: #ffffff;
    --ink: #14202e;
    --muted: #5b6b7c;
    --line: #c5d0db;
    --accent: #0b6e8a;
    --accent-ink: #ffffff;
    --ok: #1c7a4a;
    --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1822;
      --surface: #17232f;
      --ink: #e6edf3;
      --muted: #8fa1b3;
      --line: #2b3b4b;
      --accent: #4cc3e0;
      --accent-ink: #08202a;
      --ok: #5fd38d;
      --err: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 760px; }
  label {
    display: block;
    font-size: 1rem;
    color: var(--muted);
    margin: 0 0 12px 4px;
  }
  .field { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: clamp(1.25rem, 4vw, 1.9rem);
    padding: 22px 24px;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: .6; }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 14px;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .go {
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0 28px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .go:disabled { opacity: .6; cursor: default; }
  #out { margin-top: 22px; min-height: 120px; }
  .status { color: var(--muted); margin: 6px 4px; }
  .status.err { color: var(--err); }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 14px 24px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    margin: 0 0 28px 4px;
    letter-spacing: -.01em;
  }
  .ip {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: .01em;
    overflow-wrap: anywhere;
    user-select: all;
  }
  .ttl { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .copy {
    font-weight: 600;
    padding: 12px 20px;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    min-width: 96px;
  }
  .copy.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .chain { color: var(--muted); font-size: .9rem; margin: 10px 4px 0; overflow-wrap: anywhere; }
  .chain code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  @media (max-width: 520px) {
    .field { flex-direction: column; }
    .go { padding: 16px; }
    .ttl { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>IPv4 Finder</h1>
  <label for="host">Hostname</label>
  <div class="field">
    <input id="host" type="text" placeholder="node1.serene.bond" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button class="go" id="go" type="button">Look up</button>
  </div>
  <div id="out" aria-live="polite">
    <p class="status">Type a hostname and press Enter to get its IPv4 address.</p>
  </div>
</main>

<script>
(function () {
  var input = document.getElementById('host');
  var goBtn = document.getElementById('go');
  var out = document.getElementById('out');
  var counter = 0;

  function clean(v) {
    v = v.trim().toLowerCase();
    v = v.replace(/^[a-z][a-z0-9+.-]*:\/\//, '');   // protocol
    v = v.replace(/^[^@\/]*@/, '');                  // user@
    v = v.split(/[\/?#]/)[0];                        // path, query
    v = v.replace(/:\d+$/, '');                      // port
    v = v.replace(/\.$/, '');                        // trailing dot
    return v;
  }

  var ipv4 = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;

  function setStatus(msg, isErr) {
    out.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'status' + (isErr ? ' err' : '');
    p.textContent = msg;
    out.appendChild(p);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function fallbackCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }

  function render(host, answers) {
    var a = answers.filter(function (r) { return r.type === 1; });
    var cnames = answers.filter(function (r) { return r.type === 5; });
    out.innerHTML = '';

    a.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'row';

      var ip = document.createElement('div');
      ip.className = 'ip';
      ip.textContent = r.data;

      var ttl = document.createElement('div');
      ttl.className = 'ttl';
      ttl.textContent = 'TTL ' + r.TTL + 's';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        copyText(r.data).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('done');
          setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500);
        }, function () {
          btn.textContent = 'Press Ctrl+C';
        });
      });

      row.appendChild(ip);
      row.appendChild(ttl);
      row.appendChild(btn);
      out.appendChild(row);
    });

    if (cnames.length) {
      var c = document.createElement('p');
      c.className = 'chain';
      var names = [host].concat(cnames.map(function (r) { return r.data.replace(/\.$/, ''); }));
      c.innerHTML = 'Alias chain: ' + names.map(function (n) {
        var el = document.createElement('code'); el.textContent = n; return el.outerHTML;
      }).join(' → ');
      out.appendChild(c);
    }
  }

  function query(name, url) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 7000);
    return fetch(url, { headers: { 'accept': 'application/dns-json' }, signal: ctl ? ctl.signal : undefined })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (j) { clearTimeout(timer); return j; },
            function (e) { clearTimeout(timer); throw new Error(name + ': ' + (e && e.name === 'AbortError' ? 'timed out' : (e && e.message) || 'failed')); });
  }

  // Ask several DNS-over-HTTPS services at once; use the first one that answers.
  function resolve(host) {
    var q = encodeURIComponent(host);
    var providers = [
      ['Cloudflare', 'https://cloudflare-dns.com/dns-query?name=' + q + '&type=A'],
      ['Google', 'https://dns.google/resolve?name=' + q + '&type=A'],
      ['Quad9', 'https://dns.quad9.net:5053/dns-query?name=' + q + '&type=A'],
      ['Alibaba', 'https://dns.alidns.com/resolve?name=' + q + '&type=1']
    ];
    return new Promise(function (resolveP, rejectP) {
      var failed = [];
      providers.forEach(function (p) {
        query(p[0], p[1]).then(resolveP, function (e) {
          failed.push(e.message);
          if (failed.length === providers.length) rejectP(failed);
        });
      });
    });
  }

  function lookup() {
    var host = clean(input.value);
    if (!host) { setStatus('Enter a hostname first.', true); return; }
    input.value = host;

    if (ipv4.test(host)) {
      out.innerHTML = '';
      render(host, [{ type: 1, data: host, TTL: 0 }]);
      out.querySelector('.ttl').textContent = 'Already an IPv4 address';
      return;
    }
    if (!/^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)*$/.test(host)) {
      setStatus('That doesn’t look like a valid hostname.', true);
      return;
    }

    var id = ++counter;
    goBtn.disabled = true;
    setStatus('Looking up ' + host + '…');

    resolve(host).then(function (data) {
      if (id !== counter) return;
      if (data.Status === 3) {
        setStatus('No such domain: ' + host + ' doesn’t exist in DNS.', true);
      } else if (data.Status !== 0) {
        setStatus('The DNS server returned an error (code ' + data.Status + ').', true);
      } else if (!data.Answer || !data.Answer.some(function (r) { return r.type === 1; })) {
        setStatus(host + ' has no IPv4 address. It may only have an IPv6 address.', true);
      } else {
        render(host, data.Answer);
      }
    }).catch(function (errs) {
      if (id !== counter) return;
      var detail = Array.isArray(errs) ? errs.join(' | ') : String(errs);
      setStatus('Couldn’t reach any DNS service (' + detail + '). Make sure the file is opened in a normal browser tab, not a preview, and that no ad blocker or firewall is blocking it.', true);
    }).then(function () {
      if (id === counter) goBtn.disabled = false;
    });
  }

  goBtn.addEventListener('click', lookup);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(); });
})();
</script>
</body>
</html>
